<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintCPCL 测试</title>
</head>
<body>
    <h1>PrintCPCL 库测试</h1>
    <button onclick="testPrintCPCL()">测试 PrintCPCL</button>
    <pre id="output"></pre>

    <script src="dist/utils/print_cpcl.js"></script>
    <script>
        function testPrintCPCL() {
            try {
                // 测试 PrintCPCL 类
                const printer = new PrintCPCL({ width: 80, height: 50 });
                
                // 添加一些文本
                printer.text("Hello World!", { font: 8, size: 1 });
                printer.text_bold("Bold Text", { size: 2 });
                
                // 渲染
                const result = printer.render();
                
                document.getElementById('output').textContent = 
                    'PrintCPCL 测试成功!\n' +
                    '生成的数据类型: ' + (result.constructor.name) + '\n' +
                    '数据长度: ' + result.length + ' bytes\n' +
                    '前几个字节: ' + Array.from(result.slice(0, 20)).join(', ');
                
                console.log('PrintCPCL 测试成功:', result);
            } catch (error) {
                document.getElementById('output').textContent = 
                    'PrintCPCL 测试失败: ' + error.message;
                console.error('PrintCPCL 测试失败:', error);
            }
        }
    </script>
</body>
</html>
